[project]
name = "adop-testbed"
version = "1.0.0"
description = "CYSE-587/SYST-687 - ADOP (Agentic Development and Operations Platform) MVP testbed: pinned MCP reference servers, synthetic repository, fixed task set, observability/audit layer, and an Ollama-backed live agent host."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9.0",
  "pydantic>=2.7",
  "anyio>=4.4",
  "ollama>=0.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "jsonschema>=4.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live_llm: requires a real, locally-running Ollama instance with the configured model pulled",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adop_testbed*"]
